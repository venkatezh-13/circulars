name: Circulars — Daily Poll & Indexer

# ──────────────────────────────────────────────────────────────────────────────
# SCHEDULES & TRIGGERS
#   • Native Schedule : every 15 min, 6:00 AM – 1:00 AM IST (0:30–19:30 UTC)
#   • External Ping   : repository_dispatch event (triggered via cron-job.org or webhook)
#   • Manual Trigger  : workflow_dispatch
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Poll — every 15 min during market hours (6 AM – 1 AM IST = 0:30-19:30 UTC)
    - cron: '*/15 0-19 * * *'

  repository_dispatch:
    types: [poll_circulars, schedule_trigger]

  workflow_dispatch:
    inputs:
      exchanges:
        description: 'Which exchanges to poll'
        required: false
        default: 'all'
        type: choice
        options: [all, nse, bse, mcx, sebi]

# Only allow one run at a time per ref — prevents concurrent git push conflicts
concurrency:
  group: circulars-${{ github.ref }}
  cancel-in-progress: false

jobs:
  poll-and-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install httpx requests beautifulsoup4

      - name: Determine targeted exchanges
        id: flags
        run: |
          EXCHANGES="${{ github.event.inputs.exchanges || github.event.client_payload.exchanges || 'all' }}"
          echo "exchanges=${EXCHANGES}" >> $GITHUB_OUTPUT

      # NSE
      - name: Scrape NSE
        if: steps.flags.outputs.exchanges == 'all' || steps.flags.outputs.exchanges == 'nse'
        run: python scrapers/run_nse.py
        timeout-minutes: 10

      # BSE
      - name: Scrape BSE
        if: steps.flags.outputs.exchanges == 'all' || steps.flags.outputs.exchanges == 'bse'
        run: python scrapers/run_bse.py
        timeout-minutes: 15

      # MCX
      - name: Scrape MCX
        if: steps.flags.outputs.exchanges == 'all' || steps.flags.outputs.exchanges == 'mcx'
        run: python scrapers/run_mcx.py
        timeout-minutes: 10

      # SEBI
      - name: Scrape SEBI
        if: steps.flags.outputs.exchanges == 'all' || steps.flags.outputs.exchanges == 'sebi'
        run: python scrapers/run_sebi.py
        timeout-minutes: 10

      # Rebuild search index & RSS feeds
      - name: Rebuild search index & RSS
        run: python scripts/build_index.py

      # Single commit & push for all changes
      - name: Commit data and index changes
        run: |
          git config user.email "circulars-bot@github-actions"
          git config user.name  "Circulars Bot"
          git add data/ docs/search_index.json docs/rss/ || true
          if git diff --staged --quiet; then
            echo "No new data or index changes."
          else
            git commit -m "poll & index: circulars $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
